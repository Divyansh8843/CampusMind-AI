name: Deploy CampusMind AI to AWS EKS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_SERVER: campusmind/server
  ECR_REPOSITORY_AI: campusmind/ai-service
  EKS_CLUSTER_NAME: campusmind-eks-cluster

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Server)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Node Dependencies & Test
        working-directory: ./server
        run: |
          npm ci
          # Uncomment below when you have tests written
          # npm test

      - name: Setup Python (AI Service)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies & Test
        working-directory: ./ai-service
        run: |
          pip install -r requirements.txt
          # Uncomment below when you have tests written
          # pytest

  build-and-deploy:
    name: Build Docker Images and Deploy to EKS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # IMPORTANT: In a real environment, you should use OIDC to authenticate with AWS.
      # See: https://github.com/aws-actions/configure-aws-credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Node.js Server image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd server
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_SERVER:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_SERVER:latest .
          docker push -a $ECR_REGISTRY/$ECR_REPOSITORY_SERVER

      - name: Build, tag, and push AI Service image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd ai-service
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_AI:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_AI:latest .
          docker push -a $ECR_REGISTRY/$ECR_REPOSITORY_AI

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to Amazon EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Install kustomize to substitute variables in yaml (optional) or just use sed
          cd k8s
          
          # Update the images in the deployment manifests with the newly built image tag
          sed -i "s|image: campusmind/server:latest|image: $ECR_REGISTRY/$ECR_REPOSITORY_SERVER:$IMAGE_TAG|g" server-deployment.yaml
          sed -i "s|image: campusmind/ai-service:latest|image: $ECR_REGISTRY/$ECR_REPOSITORY_AI:$IMAGE_TAG|g" ai-service-deployment.yaml
          
          # Apply the configurations
          kubectl apply -f server-deployment.yaml
          kubectl apply -f ai-service-deployment.yaml
          kubectl apply -f hpa.yaml
          kubectl apply -f ingress.yaml

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/server-deployment
          kubectl rollout status deployment/ai-service-deployment

  deploy-frontend:
    name: Build and Deploy React Frontend to S3
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install and Build Frontend
        working-directory: ./client
        run: |
          npm ci
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: ./client
        # Ensure you add AWS_S3_BUCKET to your GitHub Secrets
        run: aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        # Ensure you add AWS_CLOUDFRONT_ID to your GitHub Secrets
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} --paths "/*"
