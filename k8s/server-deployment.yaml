apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
  labels:
    app: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: campusmind/server:latest # Replace with your ECR image URI later
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: server-secrets
        env:
        - name: PORT
          value: "3000"
        - name: AI_SERVICE_URL
          value: "http://ai-service-clusterip:8000"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health 
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: server-clusterip
spec:
  type: LoadBalancer
  selector:
    app: server
  ports:
  - port: 3000
    targetPort: 3000
