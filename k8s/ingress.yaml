apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campusmind-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Additional annotations for AWS ALB if using AWS Load Balancer Controller:
    # kubernetes.io/ingress.class: alb
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - host: api.campusmind.com
    http:
      paths:
      - path: /ai
        pathType: Prefix
        backend:
          service:
            name: ai-service-clusterip
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: server-clusterip
            port:
              number: 3000
