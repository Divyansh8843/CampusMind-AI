apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-deployment
  labels:
    app: ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: ai-service
        image: campusmind/ai-service:latest # Replace with your ECR image URI later
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: ai-secrets
        env:
        - name: SERVER_PUBLIC_URL
          value: "http://server-clusterip:3000"
        - name: AI_ALLOWED_DOWNLOAD_HOSTS
          value: "res.cloudinary.com,server-clusterip"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service-clusterip
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
  - port: 8000
    targetPort: 8000
